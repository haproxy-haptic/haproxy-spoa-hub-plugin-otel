global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns 127.0.0.11:53

frontend http-in
    bind *:8080
    filter spoe engine otel config /etc/haproxy/spoe-otel.conf

    # Apply the plugin's outbound TraceContext to the request to the backend.
    http-request set-header traceparent %[var(sess.otel.otel.traceparent_out)] if { var(sess.otel.otel.traceparent_out) -m found }
    http-request set-header tracestate  %[var(sess.otel.otel.tracestate_out)]  if { var(sess.otel.otel.tracestate_out) -m found }
    http-request set-header baggage     %[var(sess.otel.otel.baggage_out)]     if { var(sess.otel.otel.baggage_out) -m found }

    # Echo the correlation handle back as a response header so the e2e
    # test can verify the plugin emitted one.
    http-response set-header X-Correlation %[var(sess.otel.otel.correlation)]

    default_backend whoami

backend whoami
    server whoami whoami:80 resolvers docker init-addr none check

backend spoa-hub-backend
    mode tcp
    server hub /var/run/spoe/hub.sock maxconn 256
