services:
  otel-collector:
    build:
      context: ./otel-collector
      dockerfile: Dockerfile
    user: "0:0"
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - otel-data:/var/log/otel

  hub:
    build:
      context: ../../..
      dockerfile: haproxy-spoa-hub-plugin-otel/tests/integration/Dockerfile.hub
    volumes:
      - spoe-sock:/var/run/spoe
    depends_on:
      otel-collector:
        condition: service_started

  whoami:
    image: traefik/whoami:latest
    command: ["--port=80"]

  haproxy:
    build:
      context: ./haproxy
      dockerfile: ../Dockerfile.haproxy
    volumes:
      - spoe-sock:/var/run/spoe
    ports:
      - "${HAPROXY_PORT:-8080}:8080"
    depends_on:
      - hub
      - whoami

volumes:
  spoe-sock:
  otel-data:
